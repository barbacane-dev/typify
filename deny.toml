# cargo-deny configuration.
#
# CI runs `cargo deny check advisories`. The remaining ignore list
# covers two unmaintained-crate advisories that we cannot clear from
# our side: both come in transitively via dev-dependencies that we
# don't control. Re-evaluate when bumping or removing the cited dep.

[advisories]
ignore = [
    # adler 1.0.2 — unmaintained, superseded by adler2.
    # Pulled in transitively by miniz_oxide (→ flate2/png). Waiting on
    # the ecosystem to migrate; nothing to do on our end.
    "RUSTSEC-2025-0056",

    # paste 1.0.15 — unmaintained, see pastey / with_builtin_macros.
    # Pulled in transitively by schema-derive (a dev-dep of
    # typify-impl). Cannot clear without dropping the `schema` test
    # crate or waiting for it to migrate. Not a security issue.
    "RUSTSEC-2024-0436",
]
